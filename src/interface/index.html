  <title>TradeUy</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

      <span class="banda ms-2">TradeUy</span>

  <!-- Main content -->
  <main class="content container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="fw-bold">Inicio</h2>
      <div class="d-flex align-items-center gap-2">
        <span>Cuenta Demo</span>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" role="switch">
        </div>
      </div>
    </div>

    <div class="row g-3">

      <!-- Panel izquierdo -->
      <div class="col-lg-8">
        <div class="card p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="d-flex gap-2">
              <button class="btn btn-light btn-sm"><i class="bi bi-bell"></i> Alertas</button>
              <button class="btn btn-light btn-sm"><i class="bi bi-graph-up"></i> Análisis</button>
            </div>
            <div class="d-flex gap-1">
              <button class="btn btn-outline-secondary btn-sm">min</button>
              <button class="btn btn-outline-secondary btn-sm">h</button>
              <button class="btn btn-outline-secondary btn-sm">d</button>
              <button class="btn btn-outline-secondary btn-sm">m</button>
            </div>
          </div>
          <div id="contenedorGrafico" class="text-center p-4 border rounded bg-light">
            <h5>Gráfica</h5>
            <img src="img/grafico-ejemplo.png" class="img-fluid mt-3" alt="Gráfico">
          </div>
        </div>

        <div class="card p-3">
          <h5 class="mb-3">Cotizaciones</h5>
          <div class="d-flex justify-content-between">
            <div class="cot-box flex-fill text-center border p-2 mx-1 rounded">USD</div>
            <div class="cot-box flex-fill text-center border p-2 mx-1 rounded">EUR</div>
            <div class="cot-box flex-fill text-center border p-2 mx-1 rounded">UYU</div>
          </div>
        </div>
      </div>

      <!-- Panel derecho -->
      <div class="col-lg-4 d-flex flex-column gap-3">

        <div class="card p-3">
          <h5 class="mb-3">Operaciones</h5>
          <div class="mb-2">
            <label class="form-label">Tipo de Acción</label>
            <select class="form-select">
              <option>Limite</option>
              <option>Market</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Tipo de Orden</label>
            <select class="form-select">
              <option>Compra</option>
              <option>Venta</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Acción</label>
            <input type="text" class="form-control" placeholder="Ej: AAPL">
          </div>
          <div class="mb-3">
            <label class="form-label">Dinero</label>
            <input type="number" class="form-control" placeholder="0.00">
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-success flex-fill">Comprar</button>
            <button class="btn btn-danger flex-fill">Vender</button>
          </div>
        </div>

        <div class="card p-3">
          <h5 class="mb-2">Posiciones Abiertas</h5>
          <p class="text-muted mb-0">Sin operaciones recientes.</p>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
